    <script>
      // Gracefully handle Vite HMR in the container sandbox where live WebSocket HMR is disabled
      (function() {
        // 1. Provide Mock WebSocket for Vite HMR to prevent connection errors
        try {
          var NativeWebSocket = window.WebSocket;
          if (typeof NativeWebSocket === 'function') {
            class MockHmrWebSocket extends EventTarget {
              constructor(url, protocols) {
                super();
                this.url = url;
                this.protocols = protocols;
                this.CONNECTING = 0;
                this.OPEN = 1;
                this.CLOSING = 2;
                this.CLOSED = 3;
                this.readyState = 0;
                this.onopen = null;
                this.onclose = null;
                this.onerror = null;
                this.onmessage = null;
                setTimeout(() => {
                  if (this.readyState === 0) {
                    this.readyState = 1;
                    var evt = new Event('open');
                    this.dispatchEvent(evt);
                    if (typeof this.onopen === 'function') {
                      this.onopen(evt);
                    }
                  }
                }, 10);
              }
              send() {}
              close(code, reason) {
                this.readyState = 3;
                var evt = new CloseEvent('close', { wasClean: true, code: code || 1000, reason: reason || '' });
                this.dispatchEvent(evt);
                if (typeof this.onclose === 'function') {
                  this.onclose(evt);
                }
              }
            }

            function PatchedWebSocket(url, protocols) {
              var isHmr = false;
              if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
                isHmr = true;
              } else if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1)) {
                isHmr = true;
              }
              if (isHmr) {
                return new MockHmrWebSocket(url, protocols);
              }
              return Reflect.construct(NativeWebSocket, [url, protocols]);
            }
            PatchedWebSocket.prototype = NativeWebSocket.prototype;
            PatchedWebSocket.CONNECTING = 0;
            PatchedWebSocket.OPEN = 1;
            PatchedWebSocket.CLOSING = 2;
            PatchedWebSocket.CLOSED = 3;
            window.WebSocket = PatchedWebSocket;
          }
        } catch (e) {}

        // 2. Intercept console.error dynamically even if re-assigned by iframe shims
        var activeConsole = window.console;
        function wrapConsole(target) {
          if (!target || !target.error || target.error.__isViteFiltered) return;
          var rawError = target.error;
          var safeError = function() {
            var firstArg = arguments[0];
            if (
              firstArg === '[vite]' ||
              (typeof firstArg === 'string' && firstArg.indexOf('[vite]') !== -1)
            ) {
              return;
            }
            return rawError.apply(this, arguments);
          };
          safeError.__isViteFiltered = true;
          target.error = safeError;
        }
        wrapConsole(activeConsole);

        try {
          Object.defineProperty(window, 'console', {
            configurable: true,
            enumerable: true,
            get: function() { return activeConsole; },
            set: function(newConsole) {
              wrapConsole(newConsole);
              activeConsole = newConsole;
            }
          });
        } catch (e) {}

        // 3. Catch any unhandled rejections or error events with [vite]
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          if (typeof msg === 'string' && msg.indexOf('[vite]') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error && event.error.message));
          if (typeof msg === 'string' && msg.indexOf('[vite]') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
